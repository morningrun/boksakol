<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Kakao Talk Open Graph Meta Tags -->
    <meta property="og:title" content="2026년 복사골마라톤클럽 일요운동 출석현황">
    <meta property="og:description" content="복사골마라톤클럽 일요운동 출석체크 및 누적 현황 페이지입니다.">
    <meta property="og:image" content="https://morningrun.github.io/boksakol/todal_attendance_og.jpg">
    <meta property="og:url" content="https://morningrun.github.io/boksakol/">

    <title>2026년 복사골마라톤클럽 일요운동 출석현황</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap');
        body { font-family: 'Pretendard', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-20">

    <div class="max-w-md mx-auto bg-white min-h-screen shadow-lg flex flex-col relative">
        
        <!-- Header -->
        <header class="bg-blue-900 text-white p-5 sticky top-0 z-10 shadow-md">
            <div class="flex justify-between items-center">
                <div>
                    <h1 id="header-title" class="text-xl font-bold">2026년 11월 일요운동 출석현황</h1>
                    <p class="text-xs text-blue-200 mt-1">복사골마라톤클럽 일요일 정기운동 출석부</p>
                </div>
                <div class="text-right">
                    <span id="current-date-str" class="text-xs bg-blue-800 px-2.5 py-1 rounded-full font-medium"></span>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="p-4 flex-1 pb-24">
            
            <!-- Month Filter -->
            <div class="flex gap-2 overflow-x-auto pb-2 mb-4 scrollbar-hide">
                <button onclick="changeMonth('11')" id="btn-m11" class="px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition-colors bg-blue-600 text-white shadow-sm">11월</button>
                <button onclick="changeMonth('12')" id="btn-m12" class="px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition-colors bg-slate-100 text-slate-600 hover:bg-slate-200">12월</button>
                <button onclick="changeMonth('all')" id="btn-mall" class="px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition-colors bg-slate-100 text-slate-600 hover:bg-slate-200">전체누적</button>
            </div>

            <!-- Cumulative Status Section -->
            <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-4 mb-6">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="text-sm font-bold text-slate-800 flex items-center gap-1.5">
                        <i class="fa-solid fa-ranking-star text-blue-600"></i> 누적 출석 현황
                    </h2>
                    <span id="cumulative-date-text" class="text-[11px] text-slate-400 font-medium"></span>
                </div>
                <div id="stats-list" class="space-y-2.5 max-h-64 overflow-y-auto pr-1">
                    <!-- Dynamic Stats -->
                </div>
            </div>

            <!-- Attendance Check Section -->
            <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-4">
                <h2 class="text-sm font-bold text-slate-800 mb-3 flex items-center gap-1.5">
                    <i class="fa-solid fa-calendar-check text-blue-600"></i> 일요운동 출석 체크
                </h2>
                
                <!-- Date Selector -->
                <div class="mb-4">
                    <label class="block text-xs font-medium text-slate-500 mb-1">운동 날짜 선택 (일요일)</label>
                    <select id="attendance-date" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-sm font-medium focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        <!-- Dynamically filled Sundays -->
                    </select>
                </div>

                <!-- Member Check Grid -->
                <div class="mb-3">
                    <span class="text-xs font-medium text-slate-500">참석자 체크 (터치하여 선택)</span>
                </div>
                <div id="member-grid" class="grid grid-cols-2 gap-2">
                    <!-- Dynamically filled members -->
                </div>

                <button onclick="submitAttendance()" class="w-full mt-5 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-xl text-sm transition-colors shadow-md flex items-center justify-center gap-2">
                    <i class="fa-solid fa-check"></i> 출석체크 저장
                </button>
            </div>
        </main>

        <!-- Admin Panel Toggle Button (Bottom-Right Floating Icon) -->
        <button onclick="toggleAdminPanel()" class="fixed bottom-5 right-5 w-12 h-12 bg-slate-800 hover:bg-slate-900 text-white rounded-full shadow-lg flex items-center justify-center text-lg z-30 transition-transform active:scale-95" title="관리자 설정">
            <i class="fa-solid fa-gear"></i>
        </button>

        <!-- Admin Panel Modal / Drawer -->
        <div id="admin-panel" class="hidden fixed inset-0 bg-black/50 z-40 flex items-end sm:items-center justify-center p-0 sm:p-4">
            <div class="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl p-5 max-h-[85vh] overflow-y-auto shadow-2xl">
                <div class="flex justify-between items-center mb-4 border-b pb-3">
                    <h3 class="font-bold text-slate-800 text-base flex items-center gap-2">
                        <i class="fa-solid fa-lock text-blue-600"></i> 관리자 패널
                    </h3>
                    <button onclick="toggleAdminPanel()" class="text-slate-400 hover:text-slate-600 p-1">
                        <i class="fa-solid fa-xmark text-xl"></i>
                    </button>
                </div>

                <!-- Member Management -->
                <div class="mb-5">
                    <h4 class="text-xs font-bold text-slate-600 uppercase tracking-wider mb-2">클럽 멤버 관리</h4>
                    <div class="flex gap-2 mb-2">
                        <input type="text" id="new-member-name" placeholder="추가할 멤버 이름" class="flex-1 bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <button onclick="addMember()" class="bg-slate-800 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-slate-900 transition-colors">추가</button>
                    </div>
                    <div id="admin-member-list" class="flex flex-wrap gap-1.5 max-h-36 overflow-y-auto p-2 bg-slate-50 rounded-lg border border-slate-200">
                        <!-- Admin Member Tags -->
                    </div>
                </div>

                <!-- Data Reset / Management -->
                <div class="border-t pt-4">
                    <h4 class="text-xs font-bold text-red-600 uppercase tracking-wider mb-2">데이터 관리</h4>
                    <button onclick="clearAllLogs()" class="w-full bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 font-semibold py-2.5 px-4 rounded-xl text-xs transition-colors flex items-center justify-center gap-2">
                        <i class="fa-solid fa-triangle-exclamation"></i> 모든 출석 기록 초기화 (로그 삭제)
                    </button>
                </div>
            </div>
        </div>

    </div>

    <script>
        // 전체 복사골마라톤클럽 멤버 리스트 (누락 없이 통합 복구)
        let members = [
            "곽병우", "김경기", "김미향", "김은성", "김장곤", "김정구", "김정균", "김진철", 
            "김태수", "노진규", "노현종", "단우진", "박광남", "박정호", "박정후", "박지혜", 
            "방철규", "방지원", "송영숙", "신상철", "심재원", "안재홍", "오세창", "은대영", 
            "이동기", "이세형", "이실권", "이영학", "이은순", "이재응", "이정숙", "이종호", 
            "이학조", "이해식", "이현조", "이호병", "임장수", "장경문", "정도영", "정범희", 
            "정세원", "정하근", "정현주", "정호진", "조성국", "진용남", "최정엽", "최순규", 
            "최잔디", "황연성"
        ];

        let logs = []; // [ {name, date, score, month}, ... ]
        let selectedMonth = '11';
        let clickedStates = {}; // member -> { date: score }

        // 초기 실행
        window.onload = function() {
            initSundays();
            loadData();
        };

        function initSundays() {
            const select = document.getElementById('attendance-date');
            select.innerHTML = '';
            
            // 2026년 11월 및 12월의 일요일 날짜 자동 생성
            const sundays = [
                { label: "2026년 11월 1일 일요일", val: "2026년 11월 1일 일요일", month: "11" },
                { label: "2026년 11월 8일 일요일", val: "2026년 11월 8일 일요일", month: "11" },
                { label: "2026년 11월 15일 일요일", val: "2026년 11월 15일 일요일", month: "11" },
                { label: "2026년 11월 22일 일요일", val: "2026년 11월 22일 일요일", month: "11" },
                { label: "2026년 11월 29일 일요일", val: "2026년 11월 29일 일요일", month: "11" },
                { label: "2026년 12월 6일 일요일", val: "2026년 12월 6일 일요일", month: "12" },
                { label: "2026년 12월 13일 일요일", val: "2026년 12월 13일 일요일", month: "12" },
                { label: "2026년 12월 20일 일요일", val: "2026년 12월 20일 일요일", month: "12" },
                { label: "2026년 12월 27일 일요일", val: "2026년 12월 27일 일요일", month: "12" }
            ];

            sundays.forEach(s => {
                let opt = document.createElement('option');
                opt.value = s.val;
                opt.textContent = s.label;
                opt.dataset.month = s.month;
                select.appendChild(opt);
            });

            // 오늘 날짜와 가장 가까운 일요일 자동 선택 (기본: 오늘 혹은 가장 최근 일요일)
            select.value = "2026년 11월 15일 일요일";
            document.getElementById('current-date-str').textContent = "11월 15일 기준";
            document.getElementById('cumulative-date-text').textContent = "11.01 ~ 11.15 기준";

            select.addEventListener('change', updateMemberGridStates);
        }

        function changeMonth(m) {
            selectedMonth = m;
            document.getElementById('btn-m11').className = m === '11' ? "px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition-colors bg-blue-600 text-white shadow-sm" : "px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition-colors bg-slate-100 text-slate-600 hover:bg-slate-200";
            document.getElementById('btn-m12').className = m === '12' ? "px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition-colors bg-blue-600 text-white shadow-sm" : "px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition-colors bg-slate-100 text-slate-600 hover:bg-slate-200";
            document.getElementById('btn-mall').className = m === 'all' ? "px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition-colors bg-blue-600 text-white shadow-sm" : "px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition-colors bg-slate-100 text-slate-600 hover:bg-slate-200";

            const titleMap = { '11': '2026년 11월 일요운동 출석현황', '12': '2026년 12월 일요운동 출석현황', 'all': '복사골마라톤클럽 일요운동 전체 누적현황' };
            document.getElementById('header-title').textContent = titleMap[m];
            
            renderStats();
        }

        // 서버 연동 시뮬레이션 및 API 연동부 (Google Apps Script 연동용)
        function loadData() {
            // 구글 시트 백엔드 연동 부분 (google.script.run 연동)
            if (typeof google !== 'undefined' && google.script && google.script.run) {
                google.script.run.withSuccessHandler(onDataLoaded).getData();
            } else {
                // 테스트용 로컬 데이터
                renderMemberGrid();
                renderStats();
            }
        }

        function onDataLoaded(data) {
            if (data && data.members) members = data.members;
            if (data && data.logs) logs = data.logs;
            renderMemberGrid();
            renderStats();
        }

        function renderMemberGrid() {
            const grid = document.getElementById('member-grid');
            grid.innerHTML = '';
            
            const selectedDate = document.getElementById('attendance-date').value;
            
            // 현재 선택된 날짜에 이미 체크된 항목 반영
            const currentDayLogs = logs.filter(l => l.date === selectedDate);
            clickedStates = {};
            currentDayLogs.forEach(l => {
                clickedStates[l.name] = l.score;
            });

            // 클릭된 멤버를 상단으로 정렬
            let sortedMembers = [...members].sort((a, b) => {
                let aChecked = clickedStates[a] ? 1 : 0;
                let bChecked = clickedStates[b] ? 1 : 0;
                return bChecked - aChecked;
            });

            sortedMembers.forEach(name => {
                let score = clickedStates[name] || 0;
                let isChecked = score > 0;

                let card = document.createElement('div');
                card.className = `p-3 rounded-xl border flex items-center justify-between cursor-pointer transition-all ${isChecked ? 'bg-blue-50 border-blue-300 shadow-sm' : 'bg-white border-slate-200 hover:bg-slate-50'}`;
                card.onclick = () => toggleMember(name);

                let leftDiv = document.createElement('div');
                leftDiv.className = "flex items-center gap-2.5";
                
                let iconBox = document.createElement('div');
                iconBox.className = `w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold ${isChecked ? 'bg-blue-600 text-white' : 'bg-slate-100 text-slate-400'}`;
                iconBox.innerHTML = isChecked ? '<i class="fa-solid fa-check"></i>' : '<i class="fa-solid fa-user"></i>';
                
                let nameSpan = document.createElement('span');
                nameSpan.className = `text-sm font-semibold ${isChecked ? 'text-blue-900' : 'text-slate-700'}`;
                nameSpan.textContent = name;

                leftDiv.appendChild(iconBox);
                leftDiv.appendChild(nameSpan);

                let badge = document.createElement('span');
                badge.className = `text-xs px-2 py-0.5 rounded-full font-bold ${score === 10 ? 'bg-blue-600 text-white' : 'bg-slate-200 text-slate-600'}`;
                badge.textContent = isChecked ? (score === 10 ? '참석(10)' : '참석(5)') : '미체크';

                card.appendChild(leftDiv);
                card.appendChild(badge);
                grid.appendChild(card);
            });
        }

        function toggleMember(name) {
            if (!clickedStates[name]) {
                clickedStates[name] = 10; // 기본 참석 10점
            } else if (clickedStates[name] === 10) {
                clickedStates[name] = 5;
            } else {
                delete clickedStates[name];
            }
            renderMemberGrid();
        }

        function updateMemberGridStates() {
            renderMemberGrid();
        }

        function submitAttendance() {
            const selectedDate = document.getElementById('attendance-date').value;
            const selectOpt = document.getElementById('attendance-date').selectedOptions[0];
            const month = selectOpt ? selectOpt.dataset.month : '11';

            // 기존 해당 날짜 로그 제거 후 새로 구성
            logs = logs.filter(l => l.date !== selectedDate);
            
            for (let name in clickedStates) {
                logs.push({ name: name, date: selectedDate, score: clickedStates[name], month: month });
            }

            if (typeof google !== 'undefined' && google.script && google.script.run) {
                google.script.run.withSuccessHandler(() => {
                    alert('출석체크가 성공적으로 저장되었습니다!');
                    renderStats();
                }).saveData(logs);
            } else {
                alert('출석체크가 저장되었습니다! (오프라인 모드)');
                renderStats();
            }
        }

        function renderStats() {
            const statsList = document.getElementById('stats-list');
            statsList.innerHTML = '';

            // 점수 계산
            let scores = {};
            members.forEach(m => scores[m] = 0);

            logs.forEach(l => {
                if (selectedMonth === 'all' || l.month === selectedMonth) {
                    if (scores[l.name] !== undefined) {
                        scores[l.name] += l.score;
                    } else {
                        scores[l.name] = l.score;
                    }
                }
            });

            // 점수 높은 순 정렬 (0점인 멤버는 누적 현황에서 숨김 처리)
            let sortedScores = Object.entries(scores)
                .filter(([name, score]) => score > 0)
                .sort((a, b) => b[1] - a[1]);

            if (sortedScores.length === 0) {
                statsList.innerHTML = '<div class="text-center py-4 text-xs text-slate-400">기록된 출석 데이터가 없습니다.</div>';
                return;
            }

            sortedScores.forEach(([name, score], index) => {
                let row = document.createElement('div');
                row.className = "flex items-center justify-between p-2.5 rounded-lg bg-slate-50 border border-slate-100";
                
                let rankDiv = document.createElement('div');
                rankDiv.className = "flex items-center gap-3";
                
                let rankBadge = document.createElement('span');
                rankBadge.className = `w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold ${index === 0 ? 'bg-amber-400 text-white shadow-sm' : index === 1 ? 'bg-slate-300 text-white' : index === 2 ? 'bg-amber-600 text-white' : 'bg-slate-200 text-slate-600'}`;
                rankBadge.textContent = index + 1;

                let nameSpan = document.createElement('span');
                nameSpan.className = "text-sm font-bold text-slate-800";
                nameSpan.textContent = name;

                rankDiv.appendChild(rankBadge);
                rankDiv.appendChild(nameSpan);

                let scoreSpan = document.createElement('span');
                scoreSpan.className = "text-sm font-extrabold text-blue-600";
                scoreSpan.textContent = score + "점";

                row.appendChild(rankDiv);
                row.appendChild(scoreSpan);
                statsList.appendChild(row);
            });
        }

        // 관리자 패널 관련 함수
        function toggleAdminPanel() {
            const panel = document.getElementById('admin-panel');
            panel.classList.toggle('hidden');
            if (!panel.classList.contains('hidden')) {
                renderAdminMemberList();
            }
        }

        function renderAdminMemberList() {
            const list = document.getElementById('admin-member-list');
            list.innerHTML = '';
            members.forEach(name => {
                let tag = document.createElement('span');
                tag.className = "inline-flex items-center gap-1 bg-white border border-slate-200 px-2.5 py-1 rounded-md text-xs font-medium text-slate-700 shadow-sm";
                tag.innerHTML = `${name} <button onclick="removeMember('${name}')" class="text-slate-400 hover:text-red-500 ml-1"><i class="fa-solid fa-xmark"></i></button>`;
                list.appendChild(tag);
            });
        }

        function addMember() {
            const input = document.getElementById('new-member-name');
            const name = input.value.trim();
            if (name && !members.includes(name)) {
                members.push(name);
                input.value = '';
                renderAdminMemberList();
                renderMemberGrid();
                renderStats();
            }
        }

        function removeMember(name) {
            if (confirm(`정말 '${name}' 멤버를 삭제하시겠습니까?`)) {
                members = members.filter(m => m !== name);
                renderAdminMemberList();
                renderMemberGrid();
                renderStats();
            }
        }

        function clearAllLogs() {
            if (confirm("모든 출석 기록을 초기화하시겠습니까? 이 작업은 되돌릴 수 없습니다.")) {
                logs = [];
                renderMemberGrid();
                renderStats();
                alert("모든 기록이 초기화되었습니다.");
            }
        }
    </script>
</body>
</html>
